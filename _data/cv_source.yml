# =============================================================================
# SINGLE SOURCE OF TRUTH FOR THE CV
# =============================================================================
# Edit this file, then run `make cv` (or just push -- GitHub Actions rebuilds).
#
# It generates ALL of the following:
#   _pages/cv.md          the CV page on the website
#   _publications/*.md    the /publications/ collection
#   _talks/*.md           the /talks/ collection
#   _teaching/*.md        the /teaching/ collection
#   cv/cv.tex -> files/cv.pdf   the downloadable moderncv PDF
#
# Nothing else needs editing. Do not hand-edit the generated files -- they are
# overwritten on every build.
# -----------------------------------------------------------------------------

basics:
  first_name: Lauren
  family_name: Hoffman
  email: lhoffma2@ucsc.edu
  # Optional -- uncomment to show in the PDF header:
  # phone: "+1 (000) 000-0000"
  homepage: lahoffman.github.io
  github: lahoffman
  orcid: 0000-0002-9563-8925

# Order in which sections appear, on the website AND in the PDF.
# Reorder or delete lines here; no code changes needed.
#
# IMPORTANT: a section is only rendered if it is listed here. Adding content
# under a new top-level key is not enough -- add the key to this list too.
# (The build warns you if you forget.)
section_order:
  - research_interests
  - education
  - research_experience
  - teaching_mentoring
  - leadership_service
  - honors
  - technical_expertise
  - publications
  - invited_talks
  - presentations
  - meetings_workshops
  - industry_experience
  - personal_interests

# Separator between the parts of a compact one-line entry.
compact_separator: "; "

# Custom section headings. Anything not listed here uses a title derived from
# the key (personal_interests -> "Personal Interests").
section_titles:
  meetings_workshops: Meetings and Workshops
  teaching_mentoring: Teaching and Mentoring
  leadership_service: Leadership and Professional Service

# Sections assembled from several data blocks. The sources keep their own shape
# (and keep feeding the website collections); they are merged for display only,
# in the order listed. A key that appears here does not need to be in
# section_order -- only the merged name does.
merged_sections:
  teaching_mentoring:
    - teaching
    - guest_lectures
    - mentorship

# Which `group:` value in the talks list feeds which section above.
talk_sections:
  invited_talks: invited
  presentations: presentation
  meetings_workshops: meeting

