publications:
  - slug: xai-sst-patterns-arctic-sie-slowdowns
    status: in_progress
    authorship: first
    site: false
    authors: Hoffman, L., and F. Massonnet.
    title: eXplainable AI reveals sea surface temperature patterns associated with
      slowdowns in the decline of Arctic September sea ice extent in CESM2-LE.

  - slug: probabilistic-forecasts-september-arctic-sie
    date: 2025-02-01
    year: 2025
    authorship: first
    authors: Hoffman, L., F. Massonnet, and A. Sticker.
    title: Probabilistic forecasts of September Arctic sea ice extent at the
      interannual timescale with data-driven statistical models.
    venue: "Journal of Geophysical Research: Machine Learning and Computation"
    details: 2, e2025JH000669
    doi: 10.1029/2025JH000669
    excerpt: Data-driven statistical models are used to produce probabilistic
      forecasts of September Arctic sea ice extent at interannual lead times.

  - slug: trustworthiness-xai-sea-ice-motion
    date: 2025-01-01
    year: 2025
    authorship: first
    authors: Hoffman, L., M. Mazloff, S.T. Gille, D. Giglio, and P. Heimbach.
    title: Evaluating the trustworthiness of explainable artificial intelligence
      (XAI) methods applied to regression predictions of Arctic sea-ice motion.
    venue: Artificial Intelligence for the Earth Systems
    details: 4, e240027
    doi: 10.1175/AIES-D-24-0027.1
    excerpt: An assessment of how reliably common XAI methods explain neural
      network regression predictions of Arctic sea-ice motion.

  - slug: ml-daily-forecasts-arctic-sea-ice-motion
    date: 2023-01-01
    year: 2023
    authorship: first
    authors: Hoffman, L., M. Mazloff, S.T. Gille, D. Giglio, P. Heimbach, C. Bitz,
      and K. Matsuyoshi.
    title: "Machine learning for daily forecasts of Arctic sea-ice motion: an
      attribution assessment of model predictive skill."
    venue: Artificial Intelligence for the Earth Systems
    details: 2, 230004
    doi: 10.1175/AIES-D-23-0004.1
    excerpt: A neural network is trained to forecast daily Arctic sea-ice motion
      from remote sensing data, with explainable AI used to attribute predictive
      skill.

  - slug: ocean-salinity-atmospheric-rivers
    date: 2022-01-01
    year: 2022
    authorship: first
    authors: Hoffman, L., M. Mazloff, S.T. Gille, D. Giglio, and A. Varadarajan.
    title: Ocean salinity response to atmospheric river precipitation events in the
      California Current System.
    venue: Journal of Physical Oceanography
    details: 52, 1867–1885
    doi: 10.1175/JPO-D-21-0272.1
    excerpt: Observations and ocean model output are used to characterize the
      upper-ocean salinity response to atmospheric river events in the California
      Current System.

  - slug: solar-thermal-dominican-republic
    date: 2018-01-01
    year: 2018
    authorship: first
    authors: Hoffman, L., and T.T. Ngo.
    title: Affordable solar thermal water heating solution for rural Dominican
      Republic.
    venue: Renewable Energy
    details: 115, 1220–1230
    doi: 10.1016/j.renene.2017.09.046
    excerpt: Design and evaluation of a low-cost solar thermal water heater
      developed with community members in El Cercado, Dominican Republic.

  - slug: subsurface-ocean-antarctic-sea-ice-prediction
    date: 2026-01-01
    year: 2026
    authorship: co
    authors: Dong, X., F. Massonnet, Y. Nie, B. Richaud, Y. Gao, L. Hoffman,
      Y. Wang, and Q. Yang.
    title: Incorporating subsurface oceanic variables improves seasonal Antarctic
      sea ice prediction with neural networks.
    venue: "Journal of Geophysical Research: Atmospheres"
    details: 131, e2025JD045470
    doi: 10.1029/2025JD045470
    excerpt: Neural network forecasts of seasonal Antarctic sea ice improve when
      subsurface ocean variables are included as predictors.

  - slug: adaptive-sampling-floats-atmospheric-rivers
    date: 2025-03-01
    year: 2025
    authorship: co
    authors: Giglio, D., J. Sala, J. Gilson, L. Hoffman, and B. Kawzenuk.
    title: Adaptive sampling of the upper ocean by autonomous floats during
      atmospheric river precipitation.
    venue: Geophysical Research Letters
    details: 52, e2025GL117069
    doi: 10.1029/2025GL117069
    excerpt: Autonomous floats are adaptively targeted to sample the upper ocean
      during atmospheric river precipitation events.

  - slug: 3d-printed-polymer-supercritical-co2
    date: 2020-01-01
    year: 2020
    authorship: co
    authors: Ngo, T.T., L. Hoffman, G. Hoople, W. Trevena, U. Shakya, and G. Barr.
    title: Surface morphology and drug loading characterization of 3D-printed
      methacrylate-based polymer facilitated by supercritical carbon dioxide.
    venue: The Journal of Supercritical Fluids
    details: 160, 104786
    doi: 10.1016/j.supflu.2020.104786
    excerpt: Characterization of 3D-printed PMMA impregnated with drugs using
      supercritical carbon dioxide processing.


